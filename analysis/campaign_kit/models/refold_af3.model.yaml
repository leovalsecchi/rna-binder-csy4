# EXAMPLE refold model (from code/configs/refold__af3/default.yaml).
# Paths use ${...} placeholders resolved from site.yaml.
name: refold_af3
kind: refold
container:
  sif: ${shared}/containers/alphafold3.sif
  apptainer_cmd: run
  nv: true
  binds: ["${shared}:${shared}"]
  params_dir: ${shared}/params/af3_params
  envs: {}
entrypoint: "run_alphafold"    # backend entrypoint
params:
  num_diffusion_samples: 1
  model_seeds: [1]
  use_rna_msa: false           # msa:off — comparable across backends
  write_full_pae: false        # true only if you need ipSAE (needs full PAE; NOT retroactive)
flag_style: {boolean_flags: [], render: "--{key} {value}"}
per_unit_seed: false
io:
  needs: [design_cif, rna_sequence]   # co-folds each design's binder chain with the RNA
  emits: refold_af3/
  units_per_job: 1
compat_hints:
  min_arch: sm_75              # AF3 runs on Turing 24G via the xla backend (the 'no-Turing' note is STALE)
  vram_g: 23                   # real peak ~23G (exceeds a gpumem:20g request)
  sec_per_unit: 6840           # ~1.9h/leaf; needs 24h tier — keep OFF <24h bulk (AF3 TIMEOUTs)
probe:
  jobname_match: "(refold_af3|rfaf3)"
